name: Lint
permissions:
  contents: read
  statuses: write

on:
  pull_request:
  workflow_dispatch:

jobs:
  eslint-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: Build ESLint version matrix
        id: matrix
        run: node scripts/eslint-version-matrix.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: "package.json"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run test
        run: pnpm test --coverage.reporter=json-summary

      - name: Run build
        run: pnpm build

      - name: Update Coverage Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // 1. read coverage summary
            const fs = require('fs');
            const summaryPath = './coverage/coverage-summary.json';

            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

            // 2. Total coverage % calc
            const total = summary.total.lines.pct; 
            const color = total >= 75 ? 'success' : 'failure'; // Green if >= 75%
            const description = `Lines: ${total}% | Statements: ${summary.total.statements.pct}%`;

            // 3. Github PR checklist update
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: color,
              context: 'Vitest Coverage', // List name
              description: description, // e.g. "Lines: 85%"
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` // Click to see details
            });

  eslint-compatibility:
    needs: eslint-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.eslint-matrix.outputs.matrix) }}
    name: ESLint Compatibility / ESLint ${{ matrix.eslint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: "package.json"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ESLint compatibility version
        run: pnpm add -D eslint@${{ matrix.eslint }} @eslint/js@${{ matrix.eslintJs }} --ignore-scripts

      - name: Run ESLint compatibility test
        run: pnpm exec vitest run tests/eslint-compat.test.ts --typecheck.enabled=true
